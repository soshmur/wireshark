[workspace]
members = ["ffi"]
exclude = ["fuzz"]

[package]
name = "netscope"
version = "0.1.0"
edition = "2021"
description = "A Wireshark-class packet capture and analysis application"
license = "MIT"
build = "build.rs"

[dependencies]
netscope-ffi = { path = "ffi" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
egui_extras = "0.29"
crossbeam-channel = "0.5"
directories = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
insta = "1"

[profile.release]
debug = 1
