[package]
name = "netscope-ffi"
version = "0.1.0"
edition = "2021"
description = "The single unsafe boundary of netscope: libpcap/Npcap and OS privilege probes"
license = "MIT"
build = "build.rs"

[dependencies]
pcap = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
] }
